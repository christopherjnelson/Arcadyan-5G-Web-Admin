version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      # Security fixes are raised as available, independently of the weekly schedule.
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
      # The React plugin's peer dependency follows Vite's major version.
      vite-toolchain:
        applies-to: "version-updates"
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      # Keep routine updates together; major upgrades stay in individual PRs.
      runtime:
        applies-to: "version-updates"
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      development:
        applies-to: "version-updates"
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/"
    # Keep the Docker builder on the chosen Node 24 release line.
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    schedule:
      interval: "weekly"
    groups:
      base-images:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
