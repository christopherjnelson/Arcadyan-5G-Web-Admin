services:
  web:
    image: arcadyan-5g-web-admin:local
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GATEWAY_HOST: "${GATEWAY_HOST:-192.168.12.1}"
      GATEWAY_PORT: "${GATEWAY_PORT:-80}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
